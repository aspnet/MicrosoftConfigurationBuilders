trigger: none
pr: none

schedules:
- cron: '0 0 14 * *'
  displayName: Monthly non-production build
  branches:
    include:
    - main
  always: true

resources:
  repositories:
  - repository: MicroBuildTemplate
    type: git
    name: 1ESPipelineTemplates/MicroBuildTemplate
    ref: refs/tags/release

name: $(Date:yyyyMMdd).$(Rev:r)

variables:
- name: TeamName
  value: Asp.Net
- name: EnableNuGetPackageRestore
  value: true

extends:
  template: azure-pipelines/MicroBuild.1ES.Unofficial.yml@MicroBuildTemplate
  parameters:
    pool:
      name: VSEngSS-MicroBuild2022-1ES
      os: windows
    sdl:
      # Non-trusted "Unofficial" template build does not run SDL checks, as it is not a trusted build. So enable those here.
      enableProductionSDL: true
      binskim:
        enable: true
      codeql:
        enable: true
      policheck:
        enable: true
      tsa:
        enable: true
      sourceAnalysisPool:
        name: AzurePipelines-EO
        image: 1ESPT-Windows2022
        os: windows
    settings:
      networkIsolationPolicy: Permissive,CFSClean,CFSClean2,CFSClean3
    stages:
    - template: azure-pipeline-build.yml
      parameters:
        signType: test
